# Render Blueprint for IdentityShield (free tier).
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
# See README "Deploy to Render" for the first-start steps and free-tier limits.
#
#   identityshield-web   nginx: React dashboard + /api proxy        (public, free web service)
#   identityshield-api   FastAPI + embedded worker + demo seed       (public, free web service)
#   identityshield-kc    Keycloak (schema "keycloak" in the same DB) (public, free web service)
#   identityshield-db    Postgres (free: expires after 30 days; one free Postgres per workspace)
#   identityshield-redis Key Value / Redis (free, internal only; one free Key Value per workspace)
#
# The workspace must not already use its free Postgres / Key Value. Alternative: delete the
# `databases` and keyvalue entries and set RENDER_DATABASE_URL (e.g. Neon, direct URL) and
# REDIS_URL (e.g. Upstash rediss://, then also WORKER_POLL_SECONDS=10) on identityshield-api.
#
# Services find each other through `fromService: host` (Render adds a random suffix such as
# -ci54 when a name is taken), so no URL is hard-coded.

databases:
  - name: identityshield-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: identityshield
    user: identityshield
    ipAllowList: []   # internal connections only

services:
  - type: keyvalue
    name: identityshield-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []   # internal connections only

  - type: web
    name: identityshield-kc
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/keycloak.Dockerfile
    dockerContext: .
    healthCheckPath: /realms/master
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: identityshield-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: kcadmin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_DB_POOL_MAX_SIZE
        value: "8"
      - key: JAVA_OPTS_KC_HEAP
        value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"

  - type: web
    name: identityshield-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: /app/render-start.sh
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8000"   # the lab router calls the API on 127.0.0.1:8000
      - key: APP_ENV
        value: render
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: identityshield-db
          property: connectionString
      - key: APP_DB_ROLE
        value: is_app
      - key: IS_APP_DB_PASSWORD
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: identityshield-redis
          property: connectionString
      - key: KC_SERVICE_HOST   # -> KEYCLOAK_PUBLIC_URL / KEYCLOAK_INTERNAL_URL
        fromService:
          type: web
          name: identityshield-kc
          property: host
      - key: KC_ADMIN_USERNAME
        value: kcadmin
      - key: KC_ADMIN_PASSWORD
        fromService:
          type: web
          name: identityshield-kc
          envVarKey: KC_BOOTSTRAP_ADMIN_PASSWORD
      - key: WEB_SERVICE_HOST   # -> PUBLIC_URL (API_INTERNAL_URL = this service's RENDER_EXTERNAL_URL)
        fromService:
          type: web
          name: identityshield-web
          property: host
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: INGEST_HMAC_SECRET
        generateValue: true
      - key: PLATFORM_API_KEY
        generateValue: true
      - key: LAB_MODE
        value: "true"
      - key: LAB_API_KEY
        generateValue: true
      - key: DEMO_PASSWORD   # you type it when creating the Blueprint (12+ chars, upper, lower, digit)
        sync: false
      - key: EMBED_WORKER
        value: "true"
      - key: SEED_ON_START
        value: "true"

  - type: web
    name: identityshield-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: API_SERVICE_HOST
        fromService:
          type: web
          name: identityshield-api
          property: host
      - key: KC_SERVICE_HOST
        fromService:
          type: web
          name: identityshield-kc
          property: host
